<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sub-Contracting — ADT</title>

<!-- THE SHELL IS ADT'S, UNCHANGED. This page loads the same stylesheets as
     index.html, in the same order, and reuses the same component classes, so
     the Sub-Contracting module looks and behaves like every other module
     rather than like a second product sharing a palette. Only the last sheet
     is new, and it adds .sc-* selectors alone. -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/leaves.css">
<link rel="stylesheet" href="css/dashboard-multiview.css">
<!-- Loaded after main.css on purpose: the button system is authoritative. -->
<link rel="stylesheet" href="css/buttons.css">
<!-- Motion and row actions layer on top of the finished component set. -->
<link rel="stylesheet" href="css/motion.css">
<link rel="stylesheet" href="css/quick-actions.css">
<!-- Settles control height and button shape across every form and popup. -->
<link rel="stylesheet" href="css/form-system.css">
<!-- LAST: this module's own three shapes. Additive, .sc-* only. -->
<link rel="stylesheet" href="css/subcontracting.css">
</head>

<body>

<div id="v-sc" class="view active">

  <!-- ══ TOPBAR ══════════════════════════════════════════════════════════
       ADT's header, with one module-specific control: "Logged in as". The
       role is not a preference here — it decides which stages are open, which
       actions a log can record, and who a deal is pending with — so it sits
       in the header beside the entity, in the same dropdown shape. -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="adt-logo"><img src="assets/logo.png" alt="Opendhi"></div>
      <span class="topbar-page" id="sc-page-title">Dashboard</span>
      <!-- The page action, in the slot index.html uses for Cost Calculator and
           Calendar: shown on the page it belongs to, hidden on the others. -->
      <button class="btn-primary btn-sm" id="sc-create-btn" style="display:none" onclick="scOpenCreateSCR()"></button>
    </div>

    <div class="topbar-right" style="position:relative">
      <button class="tb-icon" title="Search" onclick="scToast('Search is not wired in this prototype','info')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
      <button class="tb-icon" title="Notifications" onclick="scToast('No new notifications','info')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg></button>

      <!-- Entity -->
      <div class="hdr-dd-wrap" id="sc-entity-wrap">
        <div class="company-sel" onclick="scToggleDD('sc-entity-dd',event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
          Hazira Works
          <svg class="hdr-dd-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="hdr-dd-panel" id="sc-entity-dd">
          <div class="hdr-dd-header">
            <div class="hdr-dd-entity-logo">HW</div>
            <div>
              <div class="hdr-dd-title">Hazira Works</div>
              <div class="hdr-dd-subtitle">Plant ID: PL-0021</div>
            </div>
          </div>
          <div class="hdr-dd-divider"></div>
          <div class="hdr-dd-info-row"><span class="hdr-dd-info-label">Purchase Office</span><span class="hdr-dd-info-val">PUR-121</span></div>
          <div class="hdr-dd-info-row"><span class="hdr-dd-info-label">Country</span><span class="hdr-dd-info-val">India</span></div>
        </div>
      </div>

      <!-- Logged in as -->
      <div class="hdr-dd-wrap sc-role-wrap" id="sc-role-wrap">
        <span class="sc-role-eyebrow">Logged in as</span>
        <div class="company-sel sc-role-sel" onclick="scToggleDD('sc-role-dd',event)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <span class="sc-role-name" id="sc-role-name">Planner</span>
          <svg class="hdr-dd-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="hdr-dd-panel hdr-dd-panel-right sc-role-dd" id="sc-role-dd"></div>
      </div>

      <!-- User -->
      <div class="hdr-dd-wrap" id="sc-user-wrap">
        <div class="user-sel" onclick="scToggleDD('sc-user-dd',event)">
          <div class="user-avatar-sm">KS</div>
          Kinjal Sisodiya
          <svg class="hdr-dd-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
        <div class="hdr-dd-panel hdr-dd-panel-right" id="sc-user-dd">
          <div class="hdr-dd-header">
            <div class="user-avatar-sm" style="width:36px;height:36px;font-size:13px;flex-shrink:0">KS</div>
            <div>
              <div class="hdr-dd-title">Kinjal Sisodiya</div>
              <div class="hdr-dd-subtitle">kinjal@hazira.works</div>
            </div>
          </div>
          <div class="hdr-dd-info-row"><span class="hdr-dd-info-label">Role</span><span class="hdr-dd-info-val" id="sc-user-role">Planner</span></div>
          <div class="hdr-dd-info-row"><span class="hdr-dd-info-label">Last login</span><span class="hdr-dd-info-val">Today, 9:41 AM</span></div>
          <div class="hdr-dd-divider"></div>
          <button class="hdr-dd-item hdr-dd-item-danger" onclick="scCloseAllDD()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Sign Out
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ BODY ════════════════════════════════════════════════════════════
       MOCK RAIL. The nav below mirrors the one in the source prototype and is
       built from a single array in js/subcontracting.js (SC_NAV) using ADT's
       own .sb-item / .sb-parent markup. Replace that array with the real
       structure and nothing else has to change. -->
  <div class="content-area">
    <div class="sidebar" id="sc-sidebar"></div>
    <div class="page-content" id="adt-content"></div>
  </div>

</div>

<!-- Popups mount here rather than inside #adt-content, so a re-render behind an
     open form cannot throw away what has been typed into it. -->
<div id="sc-modal-root"></div>

<script src="js/subcontracting.js"></script>

</body>
</html>
